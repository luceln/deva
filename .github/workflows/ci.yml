# PR 与推到 main / dev 时做类型检查 + 构建 + 同类扫描，挡住编不过、也挡住已知形状的静默失效。
# 打包与发版仍由 release.yml 负责。
#
# 为什么连 dev 一起监听：日常提交都落在 dev，只监听 main 等于这条门禁一次都不会跑——
# 等功能合进 main 才发现编不过，那时已经攒了一堆提交。
name: CI

on:
  pull_request:
  push:
    branches: [main, dev, 'feat/**']

permissions:
  contents: read

# 同一 PR 连续推送时取消上一次未跑完的检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 只做类型检查和 electron-vite 构建，用不到 Electron 二进制，跳过下载以加快安装
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v5
        with:
          # 下面「判据自身的假绿」用 `HEAD^` 当 push 场景的基线，浅克隆里 `HEAD^` 不存在，
          # 脚本会退化成全量（全绿时无害，但「只拦新增」就形同虚设）。用 0 = 完整历史。
          # 代价只是几十 MB 的 fetch；这条判据要能真正拦住新写的假绿，值得。
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      # 同类扫描：把「不许裸 existsSync 判存在、不许吞读失败、不许丢返回值」变成可执行判据。
      # 它只读源码、跨平台，脚本自己带退出码（待确认项或问题数非 0 即 exit 1）。
      - name: 同类扫描
        run: node .deva/qa/scan-same-class.cjs

      # 静态契约护栏（三项）：preload 形状、i18n 结构、品牌与数据目录。
      # 共同点：都是「编译与类型看不出、界面跑起来才炸」的静默失效——
      #  · preload 删一个方法 → 界面点下去 undefined is not a function；
      #  · i18n 少一个 key → 界面直接显示点分 key 或空白；
      #  · 默认数据目录/安装标识一变 → 程序安静地去新目录，用户看到「技能、配置、记忆全没了」，
      #    且 driver 的每个场景都设了 DEVA_HOME，默认路径只有这条护栏在守。
      # 判据都是单向的：只守「我们该有的还在」，上游新增通道/词条不拦截。
      #
      # 注意：这一步与 driver.cjs 的 shape / brandhome 场景**跑的是同一批脚本**，是有意保留的重复。
      # 保留原因：driver 的汇总只列「某场景失败」，CI 日志里看不出是 preload、i18n 还是品牌路径漂移；
      # 单独一步能让失败步骤名直接点出类别，排查时少翻一层日志。代价是多跑几遍 esbuild，可接受。
      # 别把它当冗余删掉——删了之后这几类静默失效就只剩 driver 汇总里一行字。
      - name: 静态契约护栏（preload 形状 / i18n 结构 / 品牌与数据目录）
        run: |
          node .deva/qa/check-preload-shape.cjs
          node .deva/qa/check-i18n-keys.cjs
          node .deva/qa/check-brand-home.cjs

      # 文档链接：`.md` 里引用的仓库内路径必须真的存在。
      # 守着「陈旧指令比没有指令更糟」——文档指着不存在的地方让人去找，读者扑空还看不出谁错了。
      # 刚发生过一次：决策记录换了个目录之后，
      # `.deva/` 之外有 5 处引用（LESSONS.md ×4、MEMBERS.md ×1）没跟着改，悄悄悬空——
      # 编译/类型/测试全无反应，只能靠这条守。
      # 只认带目录的路径（`notes/x.md`、`docs/x.md`、`.deva/x.md`、`../y.md`）：裸文件名多数指运行期产物
      # （`config.json` 是 <DEVA_HOME>/config.json），一律要求存在会把判据变成误报机。
      - name: 文档链接
        run: node .deva/qa/check-doc-links.cjs

      # 判据自己的假绿：新写的 `.deva/qa/*.cjs` 若拿正则断言源码却不剥注释，或用了
      # `||` 兜底正则 / 无锚点的超长跨行窗口，注释里提到的类名与函数名就能让它假绿。
      # 这种失效在编译、类型、测试里全都看不出来——只能靠元判据守。
      #
      # **只拦新增**（`--base=$QA_TRAP_BASE`）：存量的 3 个老脚本还有缺陷，
      # 全量接入会让第一次 PR 就全红、然后这条被人关掉（与重复代码基线同一个坑）。
      # 因此这里只对「本次改动涉及」的脚本报 FAIL，其余只列 BASELINE 明细。
      #
      # base ref 的取法：PR 上取目标分支，push 上取「上一个提交」。
      # 不能用 `origin/<当前分支>` —— PR 场景里它指向本次改动之前的同一分支，
      # push 到 dev/main 时又不存在对应远端跟踪分支，两种情况都会退化成全量。
      # 远端 ref 在 checkout 后是 `refs/remotes/origin/<name>` 形式，先 fetch 一次保险。
      - name: 判据自身的假绿
        env:
          QA_TRAP_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
        run: |
          # 目标分支的远端 ref 不一定在本地（PR 事件默认只 fetch 了 merge ref）
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
          fi
          node .deva/qa/check-qa-no-comment-trap.cjs --base="$QA_TRAP_BASE"

      # 重复代码：**只拦新增**，存量 41 处（832 行 / 0.86%）不拦。
      # 全量判「有重复就红」会让第一次跑就全红，然后所有人把这条关掉——jscpd 官方点名的坑。
      # 用 `.jscpd-baseline.json` 记下已知重复的指纹，新出现的才报。
      # 有意重复（比如 driver 与 CI 各自跑同一批脚本）用 /* jscpd:ignore-start|end */ 包住。
      # 清理了存量之后用 pnpm check:dup:update 重写基线。
      - name: 重复代码
        run: pnpm check:dup

      # 导入功能的行为场景（esbuild 打包后逐个独立进程跑）。
      # Linux 上有 2 个场景的夹具不成立（full 要真实 ~/.deva、gate 要 powershell.exe），
      # 它们会被显式 SKIP 并在汇总里点名，不算通过；其余必须全绿。
      - name: 导入场景
        run: node .deva/qa/driver.cjs

      # 实施门槛：把 spec §8 的任务表变成判据（文件存在 / grep 命中 / 不许再出现）。
      # 现在**阻塞**——P0 已全绿（10/10），这是它开始拦人的时刻。
      # 它挡的是「P0 没做完就跳到 P1/P2/P3」：这条规矩此前只写在 2839 行文档里，
      # 本轮实测挡不住人（P0 差 4 项时差点直接做 P3 的删除流程）。
      # 输出会写明「当前卡在哪个阶段、不允许进入哪一阶段」。
      - name: 实施门槛
        run: node .deva/qa/spec-gate.cjs

      # 分支 pill 刷新时机：用户报过「终端切完分支、点回应用 pill 还是旧值」。
      # 这里查的是源码形状（注册 focus 监听 / 清理 / 调到 refresh / 未轮询 / 注释一致）。
      # 运行时行为（pill 文本真的变、hidden 时真的跳过）要浏览器，CI 没有该依赖，
      # 见 .deva/qa/git-pill/README.md 的手动步骤——不要把本步骤当成行为验证。
      - name: 分支 pill 刷新时机
        run: node .deva/qa/check-git-focus.cjs

      # 模型失效标红：合并上游 0.1.16 时这块被暂时摘掉，迁回 ModelPanel 后靠它守住。
      # 驱动的是真实 brokenInfoOf / mainIdOf（不是副本）：本会话才标红、密钥事用警示色、
      # 徽标数、成员会话按主对话判断、swapFromRef 的 trim、拿不到结论不误标。
      # 红色贴片长什么样、点了会怎样、上游新功能还在不在，要浏览器，见 .deva/qa/model-panel/。
      - name: 模型失效标红
        run: node .deva/qa/check-model-swap.cjs

      # 依赖装失败必须说「会话仍可使用」：spec §7.7 屏⑤ / A27。
      # 只给 20 行报错会让人以为工作区废了，而实际只是 pnpm/npm 类命令会失败。
      # 这条删掉不会有任何编译或类型反馈，只能靠判据守。运行时位置/可读性要浏览器，见 .deva/qa/。
      - name: 依赖失败提示
        run: node .deva/qa/check-deps-fail-note.cjs

      # worktree 卡片的 mergeGate / dirtyCount / mergeInProgress 三个字段：拿到却不用是安静失效的
      # （按钮永远可点、目录没了却显示「干净」、半截合并没人知道）。A48 要求 disabled 只读主进程算好的
      # mergeGate，不按 state 推算——这条一旦写成常量或推断式，编译与类型都不会报错，只能靠判据守。
      - name: 工作区字段渲染
        run: node .deva/qa/check-worktree-fields.cjs

      # 体积回填走 worktree:size 增量事件：主进程发了、渲染层没接，体积就会永远停在「统计中…」。
      # 这类「A 发了事件、B 没接」的回归编译与类型都看不出来，所以这里驱动真实的
      # applySizeUpdate 纯函数喂一条事件，断言快照里的 sizeBytes 真的变了（不只查字符串）。
      - name: 体积增量回填
        run: node .deva/qa/check-worktree-size.cjs

      # 回合进行中插话要能带附件（用户报过「想截图给你看还不行」）：渲染层一旦又拿 `streaming`
      # 把粘 / 选 / 拖挡住，或者插话时忘了把附件交给主进程，界面看起来一切正常，只是图没了。
      # 前半段查源码形状，后半段 esbuild 驱动真实的 mergeDraftAttachments / toSendAttachments 跑数据。
      # 「贴进去的图真的随插话交出去、失败时真的回到输入框」要浏览器，见 .deva/qa/insert-attach/。
      - name: 插话带附件
        run: node .deva/qa/check-insert-attachments.cjs

      # 导入的密钥重加密：跨应用密文解不开时必须单独报、不能混进「跳过」或「失败」。
      # 混进任何一栏用户都不知道要做什么，结果是下次发消息才发现「服务商连不上」。
      # 这条脚本曾长期不在 CI 里，`ad9519c` 上就已经 10 PASS / 6 FAIL 红着没人发现
      # （夹具漏了上游后加的 `pluginManaged` 必填字段，六条 B 断言全挂）——接进来才守得住。
      - name: 导入密钥重加密
        run: node .deva/qa/check-import-rekey.cjs

      # 导出包必须能被**独立实现**解开：fflate 的 `Zip` 写侧固定写 data descriptor（本地头大小写 0、
      # flag bit3 置位），而它的流式读侧在 store + descriptor 条目上不按中央目录 csize 定界，而是
      # 扫描数据里的 `50 4b 07 08` 找 descriptor。随机媒体里撞到这四个字节就把条目提前截断——
      # 2MB 随机数命中率约 0.05%，80 个媒体文件累计约 8%，用户拿到的包解不开。
      # 这条判据用两种独立读法（unzipSync 按中央目录 + 真实 extractTo）逐条验哈希，连跑 30 次。
      # 它曾经不存在，于是这个缺陷带着「CI 全绿」合入过——判据不进 CI，修的东西下次还会退回去。
      - name: 导出包独立自检
        run: node .deva/qa/check-export-selfcheck.cjs

      # 「不许写 data descriptor」「end() 必须先 fsync 再 close」这两条只能静态守：进程内测不出
      # fsync（正常退出时 OS 本来就刷页，去掉它 30 次照样全绿）。B1d/B1e 是随导出包自检一起补的。
      - name: 导出写侧不得写 descriptor
        run: node .deva/qa/check-bundle-wiring.cjs

      # 流式还原的峰值内存不得随包体积增长。原判据「两次峰值比值 < 1.6」实测在 1.40~1.77 漂移
      # （10 次里 3 次假红），已改为「峰值增量 / 包体积增量 < 0.8」。
      # 这条同时守着 streamZip 的背压：早期用 `writes = writes.then(...)` 串行，每个闭包都持有
      # 它捕获的 chunk 直到链尾才释放，整包被钉在内存里——600×1MB 时 external 601.8MB，跑完不归还。
      - name: 备份包峰值内存
        run: node .deva/qa/verify-bundle-memory.cjs

      # 插话带附件的**运行时**验证：上面那条 check-insert-attachments 只查形状（签名 + 子串），
      # 在 restoreToComposer 开头加一句 `if (attachments) return` 就能让它 19/0 全绿而功能已经废了。
      # 这里在真 Chromium 里渲染真实 Composer，跑 6 条用例，其中第 6 条守的正是
      # 「插话失败 / 回合被停时，附件必须回到输入框」（二开 50e2868 的验收点）。
      # 实测：加那句短路后，只有这条用例会红（5/6），其余形状检查全绿——所以它不可替代。
      #
      # 浏览器不用自己装：ubuntu-latest（24.04）镜像**预装** Google Chrome 157.0.8103.78
      # （与 puppeteer 25.18.1 要求的版本一致）与 Chromium 157，`run.cjs` 的候选链会命中
      # /usr/bin/google-chrome。早先这里跑 `puppeteer browsers install chrome --install-deps`
      # 会红：`--install-deps` 要装系统库，需要 root，而 runner 默认不是 root（实测报
      # "Installing system dependencies requires root privileges"）。既然镜像已有浏览器，
      # 就不装、也不下载——少一个会红的环节。
      #
      # 退出码约定（见 run.cjs 头部）：0 全过 / 1 用例真失败 / 2 环境问题用例没跑。
      # 这里把 2 转成一步的结论，交给下面的兜底步骤决定要不要装浏览器。
      - name: 插话带附件（运行时）
        id: insert-attach
        run: |
          node .deva/qa/insert-attach/build.cjs
          set +e
          node .deva/qa/insert-attach/run.cjs
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::warning::插话带附件用例未执行——环境里没有可用浏览器，交给兜底步骤"
            exit 0
          fi
          exit "$code"

      # 兜底：只有上一步返回「环境问题（2）」时才装浏览器重跑，平时零开销。
      # 直接装 Google 官方 deb（与 runner 镜像自身 install-google-chrome.sh 的做法一致），
      # 不用手写 apt 包名列表——deb 的依赖由 apt 自动解析，正好绕开 Ubuntu 24.04 的 t64 改名坑：
      # `apt-get install libasound2` 在 24.04 上会失败（它已变成 virtual package，只有 libasound2t64
      # 提供实现），但作为 deb 的依赖时 apt 会自动挑到 libasound2t64，所以不用管包名。
      # 也不用 `chromium-browser`：24.04 上是 snap 过渡包，装完也用不了。
      - name: 插话带附件（运行时，兜底装浏览器）
        id: insert-attach-fallback
        if: steps.insert-attach.outputs.code == '2'
        run: |
          echo "环境里没有可用浏览器，改为安装 Google 官方 deb"
          curl -fsSL -o /tmp/google-chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/google-chrome.deb
          DEVA_CHROME_PATH=/usr/bin/google-chrome node .deva/qa/insert-attach/run.cjs

      # 英文环境再跑一遍（排在兜底之后：主步骤万一因环境没跑成，等兜底把浏览器装好再跑这条）。
      #
      # 这条不是重复劳动：这套用例曾经**只在中文系统成立**——断言写死了「附加文件」
      # 和含「附件」二字的说明文案，而 GitHub runner 的 navigator.language 是 en-US，
      # 界面渲染英文（"Attach file" / "1 attachments go with it"），两条用例必红。
      # 现在断言改成从词条表取当前 locale 的期望值，中英文都能跑；这一步就是守那个性质：
      # 谁再把文案写死回断言里，这里立刻红。
      - name: 插话带附件（运行时，英文环境）
        run: |
          set +e
          DEVA_TEST_LOCALE=en node .deva/qa/insert-attach/run.cjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error::插话带附件用例在英文环境未执行——环境里没有可用浏览器，这不代表代码有问题"
            exit 1
          fi
          exit "$code"

      # 兜底也救不回来时，必须明确说「用例没跑」，不能让它看起来像「用例失败」。
      # 条件是「主步骤报了环境问题」且「兜底步骤确实没成功」——兜底成功就不该再报错。
      - name: 插话带附件（环境问题汇总）
        if: steps.insert-attach.outputs.code == '2' && steps.insert-attach-fallback.outcome != 'success'
        run: |
          echo "::error::插话带附件用例未执行——连兜底装浏览器都失败，这不是代码问题，请检查 CI 环境"
          exit 1
