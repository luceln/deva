# PR 与推到 main / my/* 时做类型检查 + 构建 + 同类扫描，挡住编不过、也挡住已知形状的静默失效。
# 打包与发版仍由 release.yml 负责。
#
# 为什么带上 my/*：二开全部写在 my/* 分支上（main 只做上游镜像），只监听 main 等于这条门禁
# 一次都不会跑——改之前 my/dev 从未被推过，Actions 里一条记录都没有。
name: CI

on:
  pull_request:
  push:
    branches: [main, 'my/**']

permissions:
  contents: read

# 同一 PR 连续推送时取消上一次未跑完的检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 只做类型检查和 electron-vite 构建，用不到 Electron 二进制，跳过下载以加快安装
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      # 同类扫描：把「不许裸 existsSync 判存在、不许吞读失败、不许丢返回值」变成可执行判据。
      # 它只读源码、跨平台，脚本自己带退出码（待确认项或问题数非 0 即 exit 1）。
      - name: 同类扫描
        run: node .deva/qa/scan-same-class.cjs

      # 导入功能的 17 个行为场景（esbuild 打包后逐个独立进程跑）。
      # Linux 上有 2 个场景的夹具不成立（full 要真实 ~/.deva、gate 要 powershell.exe），
      # 它们会被显式 SKIP 并在汇总里点名，不算通过；其余 15 个必须全绿。
      - name: 导入场景
        run: node .deva/qa/driver.cjs
